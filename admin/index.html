<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Әдемай — басқару панелі</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #c94f87; }
    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      margin: 30px auto;
      box-shadow: 0 2px 10px #ddd;
    }
    a {
      display: block;
      background: #e86ca0;
      color: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🌸 «Әдемай» балабақшасы</h1>
  <h2>Басқару панелі</h2>

  <div class="box">
    <p>Сайтты басқару бөлімі</p>
    <a href="https://github.com/ademai-taraz/yaslisad-ademai">
      Сайтты өңдеу
    </a>
  </div>
</body>
</html>
